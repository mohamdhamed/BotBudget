services:
  bot:
    build: .
    container_name: botbudget
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    volumes:
      - ./exports:/app/exports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dashboard:
    build: .
    container_name: botbudget_dashboard
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8000
    network_mode: host
    volumes:
      - ./exports:/app/exports
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
