services:
  bot:
    build: .
    container_name: botbudget
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    volumes:
      - ./exports:/app/exports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dashboard:
    build: .
    container_name: botbudget_dashboard
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8080
    network_mode: host
    volumes:
      - ./exports:/app/exports
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  webapp:
    build: ./webapp
    container_name: botbudget_webapp
    restart: unless-stopped
    network_mode: host
    # Serves the Mini App on http://localhost:5174/app/
    # Cloudflare Tunnel should map app.botbudget.it -> localhost:5174
    # and proxy /api/* on the same host to localhost:8080 (dashboard).
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
