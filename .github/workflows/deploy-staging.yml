name: Deploy to Staging

on:
  push:
    branches:
      - feature/v1.2
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key "$USER@$HOST" <<'EOF'
            set -e
            cd ~/BotBudget
            git fetch --all
            git checkout feature/v1.2
            git pull
            docker compose -f docker-compose.staging.yml up -d --build
            docker compose -f docker-compose.staging.yml ps
          EOF

      - name: Verify logs
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key "$USER@$HOST" \
            "docker compose -f ~/BotBudget/docker-compose.staging.yml logs --tail=20 bot-staging"
