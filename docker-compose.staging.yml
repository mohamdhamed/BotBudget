services:
  bot-staging:
    build: .
    container_name: botbudget_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    network_mode: host
    volumes:
      - ./exports_staging:/app/exports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dashboard-staging:
    build: .
    container_name: botbudget_dashboard_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8081
    network_mode: host
    volumes:
      - ./exports_staging:/app/exports
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"
