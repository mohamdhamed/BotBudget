services:
  bot-staging:
    build: .
    container_name: botbudget_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    network_mode: host
    volumes:
      - ./exports_staging:/app/exports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  dashboard-staging:
    build: .
    container_name: botbudget_dashboard_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    command: uvicorn dashboard.main:app --host 0.0.0.0 --port 8081
    network_mode: host
    volumes:
      - ./exports_staging:/app/exports
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

  webapp-staging:
    build: ./webapp
    container_name: botbudget_webapp_staging
    restart: unless-stopped
    environment:
      WEBAPP_PORT: "5175"
    network_mode: host
    # Serves the Mini App on http://localhost:5175/app/
    # Cloudflare Tunnel should map app-staging.botbudget.it -> localhost:5175
    # and proxy /api/* on the same host to localhost:8081 (dashboard-staging).
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
