<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}لوحة تحكم BotBudget{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .sidebar-link.active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="flex">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-gray-100 min-h-screen p-4 fixed">
            <div class="mb-8 text-center">
                <h1 class="text-2xl font-bold text-blue-400">💰 BotBudget</h1>
                <p class="text-xs text-gray-400 mt-1">لوحة التحكم</p>
            </div>
            <nav class="space-y-2">
                <a href="{{ admin_prefix }}" class="sidebar-link block px-4 py-2 rounded hover:bg-gray-800 {% if active_page == 'overview' %}active{% endif %}">
                    📊 نظرة عامة
                </a>
                <a href="{{ admin_prefix }}/users" class="sidebar-link block px-4 py-2 rounded hover:bg-gray-800 {% if active_page == 'users' %}active{% endif %}">
                    👥 المستخدمون
                </a>
                <a href="{{ admin_prefix }}/subscribers" class="sidebar-link block px-4 py-2 rounded hover:bg-gray-800 {% if active_page == 'subscribers' %}active{% endif %}">
                    🌟 المشتركون
                </a>
                <a href="{{ admin_prefix }}/broadcast" class="sidebar-link block px-4 py-2 rounded hover:bg-gray-800 {% if active_page == 'broadcast' %}active{% endif %}">
                    📢 رسالة جماعية
                </a>
                <a href="{{ admin_prefix }}/data" class="sidebar-link block px-4 py-2 rounded hover:bg-gray-800 {% if active_page == 'data' %}active{% endif %}">
                    🗄️ إدارة البيانات
                </a>
            </nav>
            <div class="absolute bottom-4 right-4 left-4 text-xs text-gray-500 text-center">
                v1.0.0
            </div>
        </aside>

        <!-- Main content -->
        <main class="flex-1 mr-64 p-8">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
